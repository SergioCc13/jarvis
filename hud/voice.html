<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS · Voz</title>
<style>
  :root{
    --bg: #08090a;
    --panel-bg: #0d0f11;
    --accent: #6fae8c;
    --accent-dim: #253b30;
    --accent-glow: rgba(111, 174, 140, 0.22);
    --text: #d8e6ea;
    --text-dim: #5c7378;
    --bad: #ff4d5e;
    --border: #1a2226;
    --mono: 'JetBrains Mono', 'Consolas', 'SF Mono', Menlo, monospace;
    --sans: -apple-system, 'Segoe UI', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background: radial-gradient(ellipse at top, #0c1113 0%, var(--bg) 70%);
    color: var(--text);
    font-family: var(--sans);
    height:100vh;
    position:relative;
  }
  #bg-canvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .app{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center;
    height:100%; padding: max(16px, env(safe-area-inset-top)) 20px max(16px, env(safe-area-inset-bottom));
    gap:10px;
  }
  .brand{
    font-family: var(--mono); font-weight:700; letter-spacing: 4px; font-size: 14px;
    color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); flex-shrink:0;
  }
  .brand span{ color: var(--text-dim); font-weight:400; letter-spacing:1px; margin-left:6px; }

  .stage{
    flex:1; min-height:0; width:100%; max-width:420px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  }
  #orb-btn{
    background:none; border:none; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-appearance:none;
  }
  #orb-btn:disabled{ cursor:default; }
  #core-canvas{ display:block; }
  .core-label{
    font-family:var(--mono); font-size:13px; letter-spacing:3px; text-transform:uppercase;
    color: var(--text-dim); transition: color 0.4s ease; text-align:center;
  }
  .core-label.active{ color: var(--accent); }
  .core-label.error{ color: var(--bad); }

  .transcript, .reply{
    width:100%; max-width:380px; text-align:center; font-size:14px; line-height:1.5;
    min-height:1.4em; flex-shrink:0;
  }
  .transcript{ color: var(--accent); }
  .reply{ color: var(--text); font-weight:500; padding-bottom: 6px; }

  .gate{
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background: radial-gradient(ellipse at top, #0c1113 0%, var(--bg) 70%);
    padding: 20px;
  }
  .gate.hidden{ display:none; }
  .gate-icon{
    width:64px; height:64px; border-radius:50%;
    border:1px solid var(--border); background: var(--panel-bg);
    display:flex; align-items:center; justify-content:center;
    color: var(--accent); box-shadow: 0 0 18px var(--accent-glow);
  }
  .gate-icon svg{ width:30px; height:30px; }
  .gate-btn{
    font-family: var(--mono); font-size:13px; letter-spacing:1.5px; text-transform:uppercase;
    color: var(--bg); background: var(--accent); border:none; border-radius:12px;
    padding:14px 26px; cursor:pointer;
  }
  .gate-btn:active{ opacity:0.85; }
  .gate-status{
    font-family: var(--mono); font-size:12px; color: var(--text-dim); text-align:center; max-width:320px;
  }
  .gate-status.error{ color: var(--bad); }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="gate" id="gate">
  <div class="gate-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a5 5 0 0 0-5 5v3a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5Z"/>
      <path d="M7 10.5v.5a5 5 0 0 0 10 0v-.5M12 17v3M9 20h6"/>
    </svg>
  </div>
  <button class="gate-btn" id="gate-btn" type="button">Desbloquear</button>
  <div class="gate-status" id="gate-status">Verificando disponibilidad de biometría...</div>
</div>

<div class="app" id="app-main" style="display:none;">
  <div class="brand">JARVIS<span>· VOZ</span></div>

  <div class="stage">
    <button id="orb-btn" type="button" aria-label="Hablar con Jarvis">
      <canvas id="core-canvas"></canvas>
    </button>
    <span class="core-label" id="core-label">toca para hablar</span>
    <div class="transcript" id="transcript"></div>
    <div class="reply" id="reply"></div>
  </div>
</div>

<audio id="player" playsinline></audio>

<script>
/* ---------------- organic orb (ported from the HUD's canvas core) ---------------- */

const NOISE_PERM = (() => {
  const p = new Uint8Array(256);
  for(let i=0;i<256;i++) p[i] = i;
  for(let i=255;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp = p[i]; p[i] = p[j]; p[j] = tmp;
  }
  return p;
})();
function noiseFade(t){ return t*t*t*(t*(t*6-15)+10); }
function noiseLerp(a,b,t){ return a+(b-a)*t; }
function noiseHash(ix, iy){ return NOISE_PERM[(NOISE_PERM[ix & 255] + iy) & 255]; }
function noise2D(x, y){
  const x0 = Math.floor(x), y0 = Math.floor(y);
  const u = noiseFade(x-x0), v = noiseFade(y-y0);
  const n00 = noiseHash(x0, y0) / 255;
  const n10 = noiseHash(x0+1, y0) / 255;
  const n01 = noiseHash(x0, y0+1) / 255;
  const n11 = noiseHash(x0+1, y0+1) / 255;
  return (noiseLerp(noiseLerp(n00,n10,u), noiseLerp(n01,n11,u), v)) * 2 - 1;
}

const ACCENT_RGB = (() => {
  const hex = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const m = hex.match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  return m ? [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)] : [111, 174, 140];
})();

const CORE_STATES = {
  idle:       { ampNoiseR: 0.045, ampWaveR: 0,    freq1: 1.3, freq2: 3.1, timeSpeed: 0.10, waveFreq: 0, waveSpeed: 0,   breathe: 0.030, brightness: 0.42, glowR: 0.40 },
  listening:  { ampNoiseR: 0.150, ampWaveR: 0.04, freq1: 2.1, freq2: 5.4, timeSpeed: 0.55, waveFreq: 0, waveSpeed: 0,   breathe: 0.012, brightness: 0.95, glowR: 1.05 },
  processing: { ampNoiseR: 0.095, ampWaveR: 0,    freq1: 1.9, freq2: 4.3, timeSpeed: 0.40, waveFreq: 0, waveSpeed: 0,   breathe: 0.022, brightness: 0.70, glowR: 0.70 },
  speaking:   { ampNoiseR: 0.075, ampWaveR: 0.11, freq1: 1.6, freq2: 3.0, timeSpeed: 0.30, waveFreq: 3, waveSpeed: 2.2, breathe: 0.020, brightness: 0.85, glowR: 0.90 },
};
const CORE_LABELS = {
  idle: 'toca para hablar',
  listening: 'escuchando... toca para enviar',
  processing: 'procesando...',
  speaking: 'hablando...',
};

let coreTargetState = 'idle';
const coreCurrent = { ...CORE_STATES.idle };

function setCoreTarget(state, customLabel){
  coreTargetState = state;
  const labelEl = document.getElementById('core-label');
  labelEl.textContent = customLabel || CORE_LABELS[state];
  labelEl.classList.remove('error');
  labelEl.classList.toggle('active', state !== 'idle');
}

function setError(msg){
  coreTargetState = 'idle';
  const labelEl = document.getElementById('core-label');
  labelEl.textContent = msg;
  labelEl.classList.add('error');
}

function initCore(){
  const canvas = document.getElementById('core-canvas');
  const stage = document.querySelector('.stage');
  const rect = stage.getBoundingClientRect();
  const cssSize = Math.round(Math.max(200, Math.min(rect.width, rect.height * 0.62) - 20));
  canvas.style.width = cssSize + 'px';
  canvas.style.height = cssSize + 'px';

  const dpr = window.devicePixelRatio || 1;
  canvas.width = cssSize * dpr;
  canvas.height = cssSize * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const cx = cssSize/2, cy = cssSize/2, baseR = cssSize*0.26, points = 84;
  let noiseT = 0, waveT = 0, breatheT = 0, rotT = 0, floatT = 0, lastTs = null;
  const [r,g,b] = ACCENT_RGB;
  const rgba = a => `rgba(${r},${g},${b},${a})`;

  function frame(ts){
    if(lastTs === null) lastTs = ts;
    const dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;

    const target = CORE_STATES[coreTargetState];
    const lerpRate = 1 - Math.pow(0.02, dt);
    for(const key in target){
      coreCurrent[key] = noiseLerp(coreCurrent[key], target[key], lerpRate);
    }

    noiseT += coreCurrent.timeSpeed * dt;
    waveT += coreCurrent.waveSpeed * dt;
    breatheT += dt;
    rotT += dt * 0.06;
    floatT += dt;

    const scale = 1 + Math.sin(breatheT * 0.9) * coreCurrent.breathe;
    const squashX = 1 + noise2D(breatheT*0.05, 11.3) * 0.015;
    const squashY = 1 + noise2D(breatheT*0.05, 47.9) * 0.015;
    const originX = cx + Math.cos(floatT*0.17) * baseR * 0.035;
    const originY = cy + Math.sin(floatT*0.23) * baseR * 0.05;

    const pts = [];
    for(let i=0;i<points;i++){
      const theta = (i / points) * Math.PI * 2;
      const nx = Math.cos(theta), ny = Math.sin(theta);
      const sx = Math.cos(theta + rotT), sy = Math.sin(theta + rotT);
      const n1 = noise2D(sx*coreCurrent.freq1 + noiseT*0.6, sy*coreCurrent.freq1 + noiseT*1.0);
      const n2 = noise2D(sx*coreCurrent.freq2 - noiseT*1.3, sy*coreCurrent.freq2 + noiseT*0.4) * 0.5;
      const n3 = noise2D(sx*coreCurrent.freq2*1.9 + noiseT*2.1, sy*coreCurrent.freq2*1.9 - noiseT*1.7) * 0.12;
      const wave = coreCurrent.waveFreq ? Math.sin(theta*coreCurrent.waveFreq - waveT) * coreCurrent.ampWaveR*baseR : 0;
      const r0 = (baseR + (n1+n2+n3)*coreCurrent.ampNoiseR*baseR + wave) * scale;
      pts.push({ x: originX + nx*r0*squashX, y: originY + ny*r0*squashY });
    }

    ctx.clearRect(0, 0, cssSize, cssSize);

    const bri = coreCurrent.brightness * (0.85 + (coreTargetState === 'speaking' ? Math.sin(breatheT*8)*0.15 : 0));

    const haloAlpha = Math.min((0.11 + Math.sin(breatheT*0.5)*0.03) * bri, 1);
    const halo = ctx.createRadialGradient(originX, originY, 0, originX, originY, baseR*1.85);
    halo.addColorStop(0, rgba(haloAlpha));
    halo.addColorStop(1, rgba(0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(originX, originY, baseR*1.85, 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    const last = pts[pts.length-1], first = pts[0];
    let prevMid = { x:(last.x+first.x)/2, y:(last.y+first.y)/2 };
    ctx.moveTo(prevMid.x, prevMid.y);
    for(let i=0;i<pts.length;i++){
      const cur = pts[i], next = pts[(i+1)%pts.length];
      const mid = { x:(cur.x+next.x)/2, y:(cur.y+next.y)/2 };
      ctx.quadraticCurveTo(cur.x, cur.y, mid.x, mid.y);
    }
    ctx.closePath();

    const grad = ctx.createRadialGradient(originX, originY, 0, originX, originY, baseR*1.6);
    grad.addColorStop(0, rgba(Math.min(bri*0.9, 1)));
    grad.addColorStop(0.6, rgba(Math.min(bri*0.5, 1)));
    grad.addColorStop(1, rgba(0));
    ctx.fillStyle = grad;
    ctx.shadowColor = rgba(Math.min(bri, 1));
    ctx.shadowBlur = coreCurrent.glowR*baseR;
    ctx.fill();
    ctx.strokeStyle = rgba(Math.min(bri*0.8, 1));
    ctx.lineWidth = 1;
    ctx.shadowBlur = 0;
    ctx.stroke();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------------- ambient background (same drifting glow field as the HUD) ---------------- */

function initBackground(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  const [r,g,b] = ACCENT_RGB;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = 0, h = 0;

  function resize(){
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w*dpr);
    canvas.height = Math.round(h*dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const particles = Array.from({ length: 12 }, () => ({
    bx: Math.random(), by: Math.random(),
    rx: 0.10 + Math.random()*0.16,
    ry: 0.08 + Math.random()*0.14,
    speed: 0.018 + Math.random()*0.024,
    dir: Math.random() < 0.5 ? 1 : -1,
    phase: Math.random()*Math.PI*2,
    radius: 90 + Math.random()*150,
    alpha: 0.02 + Math.random()*0.035,
  }));

  let t = 0, lastTs = null;
  function frame(ts){
    if(lastTs === null) lastTs = ts;
    const dt = Math.min((ts-lastTs)/1000, 0.05);
    lastTs = ts;
    t += dt;

    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      const a = t*p.speed*p.dir + p.phase;
      const cx = (p.bx + Math.cos(a)*p.rx) * w;
      const cy = (p.by + Math.sin(a*0.85)*p.ry) * h;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, p.radius);
      grad.addColorStop(0, `rgba(${r},${g},${b},${p.alpha})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, p.radius, 0, Math.PI*2);
      ctx.fill();
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------------- voice bridge wiring ---------------- */

const params = new URLSearchParams(location.search);
let token = params.get('token');
if (token) localStorage.setItem('jarvis_token', token);
else token = localStorage.getItem('jarvis_token') || '';

const btn = document.getElementById('orb-btn');
const transcriptEl = document.getElementById('transcript');
const replyEl = document.getElementById('reply');
const player = document.getElementById('player');

let mediaRecorder, chunks = [], recording = false, busy = false;

async function ensureRecorder() {
  if (mediaRecorder) return mediaRecorder;
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = sendAudio;
  return mediaRecorder;
}

btn.addEventListener('click', async () => {
  if (busy) return;
  if (!token) {
    setError('Falta el token: abre el enlace con ?token=...');
    return;
  }
  if (!recording) {
    try {
      const mr = await ensureRecorder();
      chunks = [];
      mr.start();
      recording = true;
      setCoreTarget('listening');
      transcriptEl.textContent = '';
      replyEl.textContent = '';
    } catch (err) {
      setError('No pude acceder al micrófono (' + err.name + '): ' + err.message);
    }
  } else {
    mediaRecorder.stop();
    recording = false;
    busy = true;
    btn.disabled = true;
    setCoreTarget('processing');
  }
});

async function sendAudio() {
  const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
  try {
    const resp = await fetch(`/voice?token=${encodeURIComponent(token)}`, {
      method: 'POST',
      headers: { 'Content-Type': blob.type },
      body: blob,
    });
    if (!resp.ok) {
      setError('Error: ' + await resp.text());
      busy = false;
      btn.disabled = false;
      return;
    }
    const transcript = decodeURIComponent(resp.headers.get('X-Transcript') || '');
    const reply = decodeURIComponent(resp.headers.get('X-Reply') || '');
    transcriptEl.textContent = transcript ? 'Tú: ' + transcript : '';
    replyEl.textContent = reply ? 'Jarvis: ' + reply : '';
    const audioBlob = await resp.blob();
    player.src = URL.createObjectURL(audioBlob);
    setCoreTarget('speaking');
    await player.play();
  } catch (err) {
    setError('Error de red: ' + err.message);
    busy = false;
    btn.disabled = false;
  }
}

player.addEventListener('ended', () => {
  setCoreTarget('idle');
  busy = false;
  btn.disabled = false;
});

/* ---------------- biometric gate (client-side WebAuthn, no server verification —
   see chat: protects against a lost/unlocked phone, not against a leaked token
   used directly against the API) ---------------- */

const CRED_KEY = 'jarvis_webauthn_cred_id';
const gateEl = document.getElementById('gate');
const appMainEl = document.getElementById('app-main');
const gateBtn = document.getElementById('gate-btn');
const gateStatusEl = document.getElementById('gate-status');

function unlockApp() {
  gateEl.classList.add('hidden');
  appMainEl.style.display = 'flex';
  initBackground();
  initCore();
}

function b64uToBuf(b64u) {
  const b64 = b64u.replace(/-/g, '+').replace(/_/g, '/').padEnd(b64u.length + (4 - b64u.length % 4) % 4, '=');
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf;
}
function bufToB64u(buf) {
  let bin = '';
  new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function registerBiometric() {
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: 'Jarvis' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'jarvis-phone', displayName: 'Jarvis (teléfono)' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
      timeout: 60000,
    },
  });
  localStorage.setItem(CRED_KEY, bufToB64u(cred.rawId));
}

async function verifyBiometric(credIdB64u) {
  await navigator.credentials.get({
    publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ id: b64uToBuf(credIdB64u), type: 'public-key' }],
      userVerification: 'required',
      timeout: 60000,
    },
  });
}

async function runGate() {
  if (!token) {
    gateStatusEl.textContent = 'Falta el token: abre el enlace con ?token=...';
    gateStatusEl.classList.add('error');
    gateBtn.disabled = true;
    return;
  }

  const supported = window.PublicKeyCredential
    && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(() => false);

  if (!supported) {
    gateStatusEl.textContent = 'Este navegador no soporta biometría — entrando solo con el token.';
    unlockApp();
    return;
  }

  const storedCredId = localStorage.getItem(CRED_KEY);
  gateBtn.textContent = storedCredId ? 'Desbloquear con Face ID / huella' : 'Registrar este teléfono';
  gateStatusEl.textContent = storedCredId
    ? 'Toca el botón y confirma con tu huella o rostro.'
    : 'Primera vez aquí: registra este teléfono con tu huella o Face ID.';

  gateBtn.addEventListener('click', async () => {
    gateBtn.disabled = true;
    gateStatusEl.classList.remove('error');
    try {
      const credId = localStorage.getItem(CRED_KEY);
      if (credId) {
        await verifyBiometric(credId);
      } else {
        await registerBiometric();
      }
      unlockApp();
    } catch (err) {
      gateStatusEl.textContent = 'No se pudo verificar (' + err.name + '): ' + err.message;
      gateStatusEl.classList.add('error');
      gateBtn.disabled = false;
    }
  });
}

runGate();
</script>
</body>
</html>
